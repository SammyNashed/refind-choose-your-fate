# refind-choose-your-fate — Morpheus offers the pills; your OSes are the pills.
# Designed for exactly two boot entries (one per hand): Windows = blue pill, Linux = red pill.
# rEFInd lists manual entries in the order they appear in refind.conf, so put Windows first
# if you want it in the left hand.

hideui singleuser,hints,arrows,label,badges
icons_dir themes/refind-choose-your-fate/icons

# 16:9 screens (1920x1080 etc.). On a 16:10 screen (1920x1200, 2560x1600)
# switch to background-1920x1200.png so the icons land on the hands.
banner themes/refind-choose-your-fate/background.png
banner_scale fillscreen

# Icon sizes are tuned to the hands in the background — change them and the pills drift.
big_icon_size 384
small_icon_size 56
selection_big   themes/refind-choose-your-fate/selection_big.png
selection_small themes/refind-choose-your-fate/selection_small.png

use_graphics_for linux,windows
showtools reboot,shutdown,firmware
max_tags 2
